name: 'Dashboard Data Auto-Update (hourly)'

# Every hour, regenerate docs/dashboard-data.json from current state.
# The static dashboard.html fetches this file on every page load, so it
# automatically shows the latest data without redeployment.

on:
  schedule:
    - cron: '17 * * * *'  # Every hour at :17 (off-peak from other crons)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    name: Regenerate dashboard-data.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install deps
        working-directory: automation
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Regenerate dashboard-data.json
        working-directory: automation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          .venv/bin/python scripts/update_dashboard_data.py

      - name: Commit if changed
        run: |
          git config --global user.name "Mavis bot"
          git config --global user.email "mavis@MiniMax"
          git remote set-url origin "https://x-access-token:${APEX_PAT}@github.com/yip-lgtm/YW-concept-ki7409.git"
          git pull --rebase --autostash origin main 2>&1 || echo "pull failed, continuing"
          if git diff --quiet docs/dashboard-data.json; then
            echo "No changes to dashboard-data.json"
            exit 0
          fi
          git add docs/dashboard-data.json
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M")
          git commit -m "auto(dashboard): update data ${TIMESTAMP}" || true
          git push --force-with-lease origin main || echo "push failed"
