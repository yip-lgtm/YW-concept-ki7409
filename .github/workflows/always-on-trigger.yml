name: Always-On Trigger — Stall Detector

# Last-resort safety net for the two scanning loops.
#
# Why this exists (measured 2026-10-09): GitHub Actions `schedule` events
# are best-effort, not guaranteed. On this repo live-scan's `*/15` cron was
# firing every 30–280 minutes, with multi-hour gaps, even though every run
# it did produce reported success. The jobs were never broken — they were
# simply not being triggered.
#
# Root cause of the delay: 50 of the ~73 workflow runs in a 6h window were
# "pages build and deployment". Pages is on the LEGACY dynamic build, which
# fires on EVERY push to main regardless of which files changed (50 pushes
# produced 50 builds; only 1 of those commits actually touched docs/). That
# churn consumes the Actions concurrency slots that scheduled runs need.
#
# This workflow is level 3 of defence:
#   1. each scan's own cron (primary, best-effort)
#   2. this stall detector (every 5 min, checks the last run timestamp and
#      re-dispatches if the loop has gone quiet)
#   3. master-self-heal (currently disabled to save quota)
#
# It dispatches rather than duplicating work, so there is still exactly one
# commit per scan and no push race.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ secrets.APEX_PAT }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      REPO: yip-lgtm/YW-concept-ki7409
    steps:
      - name: Re-dispatch any scan loop that has gone quiet
        run: |
          NOW=$(date -u +%s)
          ALERTED=""

          # workflow file : max minutes of silence before we force a re-run
          check_loop() {
            local wf="$1" threshold="$2" label="$3"
            local last_run last_ts diff

            last_run=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${wf}/runs?per_page=1" \
              | python3 -c 'import sys,json; r=json.load(sys.stdin).get("workflow_runs",[]); print(r[0].get("created_at","") if r else "")' \
              2>/dev/null || echo "")

            if [ -z "$last_run" ]; then
              echo "  ${label}: no runs found — API unavailable or never triggered, skipping"
              return 0
            fi

            last_ts=$(date -u -d "$last_run" +%s 2>/dev/null || echo 0)
            if [ "$last_ts" = "0" ]; then
              echo "  ${label}: unparseable timestamp, skipping"
              return 0
            fi

            diff=$(( (NOW - last_ts) / 60 ))
            if [ "$diff" -gt "$threshold" ]; then
              echo "  ${label}: STALLED ${diff}m > ${threshold}m — re-dispatching"
              curl -s -X POST -H "Authorization: token $GH_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/${REPO}/actions/workflows/${wf}/dispatches" \
                -d '{"ref": "main"}' > /dev/null
              ALERTED="${ALERTED}${label} (${diff}m)"$'\n'
            else
              echo "  ${label}: healthy (${diff}m ago)"
            fi
          }

          # live-scan: cron is */15, so 25m of silence is unambiguous
          check_loop "live-scan.yml" 25 "live-scan"
          # unified-pipeline: two crons at */15, 20m threshold
          check_loop "unified-pipeline.yml" 20 "unified-pipeline"

          if [ -n "$ALERTED" ]; then
            MSG="🚨 Always-On re-triggered stale scan loop(s):$(printf "\\n${ALERTED}")"
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${MSG}" > /dev/null 2>&1
            echo "  TG alert sent"
          fi