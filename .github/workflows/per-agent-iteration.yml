name: Per-Agent LLM Iteration — 10 Agents @ 00:00 HKT

# Each of the 10 strategy sub-agents gets its own iteration job
# All run in parallel at 00:00 HKT (16:00 UTC) weekdays
# Self-optimizing — auto-applies high-confidence suggestions

on:
  schedule:
    - cron: '0 16 * * 1-5'  # 00:00 HKT weekdays
  workflow_dispatch:
    inputs:
      agent:
        description: 'Run iteration for specific agent (id)'
        required: false

permissions:
  contents: write

jobs:
  # 10 parallel jobs, one per agent
  iterate-rsi-div:
    name: '🔁 yw-rsi-div (RSI Divergence)'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip', cache-dependency-path: automation/requirements.txt}
      - run: python -m venv .venv && .venv/bin/pip install -q -r automation/requirements.txt
      - run: .venv/bin/python automation/scripts/llm_iterate_all.py --agent rsi-div
      - uses: stefanzweifel/git-auto-commit-action@v5
        with: {commit_message: 'auto(iter): rsi-div iteration @ '}

  iterate-50-20-pullback:
    name: '🔁 yw-50-20-pullback'
