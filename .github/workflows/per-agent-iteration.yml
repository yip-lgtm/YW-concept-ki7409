name: Per-Agent LLM Iteration — 11 Agents @ 00:25 HKT

# 2026-10-29 — collapsed 10 parallel jobs into 1.
#
# What was broken (measured 2026-10-29, git log + Actions job logs):
#
#   1. SELF-RACE. Ten parallel jobs each ran `git-auto-commit-action`
#      against `main`. Only one push can win a non-fast-forward race, so
#      9 of the 10 iterations were thrown away on every run. The
#      workflow failed on EVERY scheduled run from 2026-10-05 onward
#      ("[rejected] main -> main (non-fast-forward)"). Only 4 of the 10
#      agents (h-pattern, b1, rsi-div, 50-20-pullback) ever landed a
#      file, and only because they happened to win the race.
#
#   2. CROSS-WORKFLOW CRON CLASH. Four workflows all started at
#      16:00 UTC and all pushed to `main`: per-agent-iteration,
#      strategy-ranking, llm-iteration-scientist, yw-daily.
#
#   3. WRONG OUTPUT SHAPE. The per-agent mode writes
#      `iteration_<agent>_<TS>.json`, which nothing downstream reads.
#      The consumers — param_optimizer, regen_strategy_doc,
#      update_dashboard_data, regen_review_manifests — all read
#      `iteration_all_<TS>.json`, which is produced by the all-agents
#      mode and was already landing fine via strategy-ranking.yml.
#
# What this version does:
#
#   - ONE job, ONE push. `llm_iterate_all.py` already fans out to the
#     11 agents across parallel threads internally, so wall-clock time
#     is unchanged — there is just one commit instead of ten racing
#     ones.
#   - It emits `iteration_all_*.json`, the shape the pipeline actually
#     consumes.
#   - Cron moved to 00:25 HKT so it no longer starts in the same minute
#     as the other three 16:00 UTC workflows.
#   - The push does rebase + retry, because ~15 other workflows push to
#     `main` throughout the day and a non-fast-forward rejection is
#     expected occasionally, not a workflow failure.
#
# Side effect worth knowing: the old job list had only 10 agents and
# silently skipped argon-gold. This version iterates all 11.
#
# Daily LLM call count is unchanged (10 jobs x 1 agent before, 1 job x
# 11 agents now) — this does not add quota pressure.

on:
  schedule:
    - cron: '25 16 * * 1-5'  # 00:25 HKT weekdays (staggered off 00:00)
  workflow_dispatch:
    inputs:
      agent:
        description: 'Run iteration for one agent id only. Leave empty for all 11.'
        required: false

permissions:
  contents: write

# Two runs of this workflow must never overlap.
concurrency:
  group: per-agent-iteration
  cancel-in-progress: false

jobs:
  iterate:
    name: '🔁 LLM iteration — 11 strategy agents'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip', cache-dependency-path: automation/requirements.txt}

      - run: python -m venv .venv && .venv/bin/pip install -q -r automation/requirements.txt

      - name: Run LLM iteration (all 11 agents, or one when dispatched with an agent id)
        working-directory: automation
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          AGENT="${{ inputs.agent }}"
          if [ -n "$AGENT" ]; then
            echo "[iterate] single agent: $AGENT"
            .venv/bin/python scripts/llm_iterate_all.py --agent "$AGENT" 2>&1 | tee /tmp/iterate_log.txt
          else
            echo "[iterate] all 11 agents"
            .venv/bin/python scripts/llm_iterate_all.py 2>&1 | tee /tmp/iterate_log.txt
          fi

      - name: Commit + push (rebase and retry on non-fast-forward)
        run: |
          git add automation/reports/strategy_ranking/iterations/
          if git diff --cached --quiet; then
            echo "no iteration files changed — nothing to commit"
            exit 0
          fi
          git commit -m "auto(iter): LLM iteration for 11 agents @ $(date -u +%Y-%m-%dT%H:%M)"
          # ~15 other workflows push to main throughout the day. A push
          # rejected as non-fast-forward is an expected race, not a
          # failure — rebase onto the new tip and try again.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git pull --rebase origin main || true
            if git push origin main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i rejected (non-fast-forward) — retrying"
            sleep 10
          done
          echo "push failed after 5 attempts"
          exit 1
