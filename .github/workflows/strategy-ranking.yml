name: 'Strategy Ranking & LLM Iteration'

# Daily 21:30 HKT (after yw-daily at 21:00 + yw-publish at 21:30)
# 1. Run ranking of all 9 strategies (backtest mode)
# 2. Query MiniMax-M3 LLM for worst strategy optimization
# 3. Auto-commit results to main

on:
  schedule:
    # HKT 00:00 = UTC 16:00 — 每日 auto rank + push + web publish
    - cron: '0 16 * * *'   # 每日 00:00 HKT (primary)
    # Backup: 12:00 UTC + 20:00 UTC (GHA cron 唔可靠, 3x coverage)
    - cron: '0 12 * * *'   # 每日 20:00 HKT (backup)
    - cron: '0 20 * * *'   # 每日 04:00 HKT (backup)
  workflow_dispatch:
  # NOTE: don't add on: push - GHA creates phantom "push" runs
  # when force-push happens, which fail because the workflow isn't designed for push events.

permissions:
  contents: write

jobs:
  strategy-ranking:
    name: Daily strategy ranking + LLM iteration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.APEX_PAT }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install deps
        working-directory: automation
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Run strategy ranking
        id: ranking
        working-directory: automation
        run: |
          .venv/bin/python scripts/strategy_ranking.py 2>&1 | tee /tmp/ranking_log.txt
          cat automation/reports/strategy_ranking/ranking_*.md | tail -50

      - name: LLM iteration per-agent (9 strategies in parallel)
        id: iterate-all
        working-directory: automation
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          .venv/bin/python scripts/llm_iterate_all.py 2>&1 | tee /tmp/iterate_all_log.txt

      - name: "LLM iteration (legacy: worst strategy)"
        id: iterate
        working-directory: automation
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          .venv/bin/python scripts/llm_iterate.py 2>&1 | tee /tmp/iterate_log.txt

      - name: Send TG summary
        if: always()
        working-directory: automation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          .venv/bin/python scripts/strategy_tg_summary.py


      - name: "Auto-update dashboard data (web publish)"
        if: always()
        working-directory: automation
        run: |
          .venv/bin/python scripts/update_dashboard_data.py 2>&1 | tee /tmp/dashboard_log.txt || true

      - name: "Auto-backup data (ranking + dashboard + state)"
        if: always()
        working-directory: automation
        run: |
          mkdir -p /tmp/daily_backup
          cp -r reports/strategy_ranking /tmp/daily_backup/ 2>&1 || true
          cp docs/dashboard-data.json /tmp/daily_backup/ 2>&1 || true
          cp reports/llm_iteration/latest.json /tmp/daily_backup/llm_iteration_latest.json 2>&1 || true
          tar czf /tmp/daily_backup_$(date -u +%Y%m%d).tar.gz -C /tmp daily_backup 2>&1 || true
          echo "Backup size: $(ls -la /tmp/daily_backup_*.tar.gz 2>&1 | tail -1)"

      - name: "Git push dashboard + iteration state"
        if: always()
        run: |
          git config --global user.name "Mavis bot"
          git config --global user.email "mavis@MiniMax"
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/yip-lgtm/YW-concept-ki7409.git"
          git add docs/dashboard-data.json automation/reports/llm_iteration/ || true
          git commit -m "auto(dashboard): daily web data update $(date -u +%Y-%m-%dT%H:%M)" --allow-empty || true
          git push origin main || true

      - name: "Send final completion TG"
        if: always()
        working-directory: automation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          .venv/bin/python -c "
import os, requests
from datetime import datetime
from zoneinfo import ZoneInfo
hkt = datetime.now(ZoneInfo('Asia/Hong_Kong')).strftime('%Y-%m-%d %H:%M HKT')
ny = datetime.now(ZoneInfo('America/New_York')).strftime('%Y-%m-%d %H:%M EDT')
msg = f'✅ <b>Daily Auto-Pipeline Complete</b>%0A%0A🌐 Web: https://yip-lgtm.github.io/YW-concept-ki7409/%0A⏰ HKT: {hkt}%0A⏰ NY: {ny}%0A%0A📊 Rank + LLM iter + web + backup + push — all done.%0ANo manual needed.'
r = requests.post(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage", json={'chat_id': os.environ['TELEGRAM_CHAT_ID'], 'text': msg, 'parse_mode': 'HTML'}, timeout=10)
print(f'TG: {r.json().get("ok")}')"

      - name: Commit ranking + iteration
        if: always()
        run: |
          git config --global user.name "Mavis bot"
          git config --global user.email "mavis@MiniMax"
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/yip-lgtm/YW-concept-ki7409.git"
          git add automation/reports/strategy_ranking/ || true
          git commit -m "auto(ranking): daily strategy PnL ranking + LLM iteration $(date -u +%Y-%m-%dT%H:%M)" --allow-empty || true
          git push origin main || true
