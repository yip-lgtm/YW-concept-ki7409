name: 'Strategy Ranking & LLM Iteration'

# Daily 21:30 HKT (after yw-daily at 21:00 + yw-publish at 21:30)
# 1. Run ranking of all 9 strategies (backtest mode)
# 2. Query MiniMax-M3 LLM for worst strategy optimization
# 3. Auto-commit results to main

on:
  schedule:
    # HKT 00:00 = UTC 16:00 — Daily auto rank + push + web publish
    # 9/22 user feedback: 每日排ranking (1x daily, not 3x)
    - cron: '0 16 * * *'   # 每日 00:00 HKT
  workflow_dispatch:
  # NOTE: don't add on: push - GHA creates phantom "push" runs
  # when force-push happens, which fail because the workflow isn't designed for push events.

permissions:
  contents: write

jobs:
  strategy-ranking:
    name: Daily strategy ranking + LLM iteration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.APEX_PAT }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install deps
        working-directory: automation
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Run strategy ranking
        id: ranking
        working-directory: automation
        run: |
          .venv/bin/python scripts/strategy_ranking.py 2>&1 | tee /tmp/ranking_log.txt
          cat automation/reports/strategy_ranking/ranking_*.md | tail -50

      - name: Run daily settlement (level promotion)
        id: settlement
        if: always()
        working-directory: automation
        run: |
          .venv/bin/python scripts/daily_settlement.py 2>&1 | tee /tmp/settlement_log.txt || true
          echo "--- settlement output ---"
          cat automation/reports/strategy_settlement/settlement_*.md 2>/dev/null | tail -50 || true

      - name: LLM intervention — auto-lower conditions for stuck agents
        id: llm-intervene
        if: always()
        working-directory: automation
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          .venv/bin/python scripts/settlement_llm_intervene.py 2>&1 | tee /tmp/llm_intervene_log.txt || true
          echo "--- intervention output ---"
          cat automation/config/settlement_overrides.json 2>/dev/null | head -60 || true

      - name: RL iteration agent (PPO — learns per-strategy exit policy)
        id: rl-iterate
        if: always()
        working-directory: automation
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          .venv/bin/python scripts/rl_iterate.py 2>&1 | tee /tmp/rl_iterate_log.txt || true
          echo "--- learned exit overrides ---"
          cat ../automation/config/exit_overrides.json 2>/dev/null | head -60 || true

      - name: RL exit policy A/B report
        id: rl-ab
        if: always()
        working-directory: automation
        run: |
          .venv/bin/python scripts/rl_arm_report.py 2>&1 | tee /tmp/rl_ab_log.txt || true
          echo "--- A/B report ---"
          cat reports/rl_iteration/ab_*.md 2>/dev/null | tail -40 || true

      - name: LLM iteration per-agent (9 strategies in parallel)
        id: iterate-all
        working-directory: automation
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          .venv/bin/python scripts/llm_iterate_all.py 2>&1 | tee /tmp/iterate_all_log.txt

      - name: Historical backtest (180d, 1h bars) — second independent track
        id: hist-backtest
        if: always()
        working-directory: automation
        run: |
          .venv/bin/python scripts/historical_backtest.py --days 180 2>&1 \
            | tee /tmp/hist_backtest_log.txt || echo "hist backtest failed"

      - name: Data-driven weight optimization (PF/WR/RR decides, LLM vetoes)
        id: weight-opt
        if: always()
        run: |
          .venv/bin/python automation/scripts/weight_optimizer.py 2>&1 | tee /tmp/weight_opt_log.txt || true
          echo "--- weight report ---"
          cat automation/reports/weight_optimization/weight_*.md 2>/dev/null | tail -25 || true

      - name: Apply LLM param suggestions (auto-optimize)
        id: param-apply
        if: always()
        working-directory: automation
        run: |
          .venv/bin/python scripts/param_optimizer.py 2>&1 | tee /tmp/param_apply_log.txt || true
          echo "--- strategy_overrides.json ---"
          cat automation/config/strategy_overrides.json 2>/dev/null | head -80 || true

      - name: "LLM iteration (legacy: worst strategy)"
        id: iterate
        working-directory: automation
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          .venv/bin/python scripts/llm_iterate.py 2>&1 | tee /tmp/iterate_log.txt

      - name: Send TG summary
        if: always()
        working-directory: automation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          .venv/bin/python scripts/strategy_tg_summary.py


      - name: "Auto-update dashboard data (web publish)"
        if: always()
        working-directory: automation
        run: |
          .venv/bin/python scripts/update_dashboard_data.py 2>&1 | tee /tmp/dashboard_log.txt || true
          .venv/bin/python scripts/regen_review_manifests.py 2>&1 | tee /tmp/manifests_log.txt || true

      - name: "Auto-backup data (ranking + dashboard + state)"
        if: always()
        working-directory: automation
        run: |
          mkdir -p /tmp/daily_backup
          cp -r reports/strategy_ranking /tmp/daily_backup/ 2>&1 || true
          cp docs/dashboard-data.json /tmp/daily_backup/ 2>&1 || true
          cp reports/llm_iteration/latest.json /tmp/daily_backup/llm_iteration_latest.json 2>&1 || true
          tar czf /tmp/daily_backup_$(date -u +%Y%m%d).tar.gz -C /tmp daily_backup 2>&1 || true
          echo "Backup size: $(ls -la /tmp/daily_backup_*.tar.gz 2>&1 | tail -1)"

      - name: "Git push dashboard + iteration state"
        if: always()
        run: |
          git config --global user.name "Mavis bot"
          git config --global user.email "mavis@MiniMax"
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/yip-lgtm/YW-concept-ki7409.git"
          # Never publish a file that does not parse. docs/dashboard-data.json
          # is served directly by the public site, so a malformed file (a
          # half-resolved merge, conflict markers) breaks the dashboard for
          # everyone. Validate before staging, and skip the file if it is bad.
          for f in docs/dashboard-data.json docs/charts-manifest.json docs/trades-manifest.json docs/rankings-manifest.json docs/llm-iterations-manifest.json; do
            if [ -f "$f" ]; then
              if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" 2>/dev/null; then
                echo "SKIP invalid JSON: $f"
                git checkout --force origin/main -- "$f" 2>/dev/null || git rm --force -- "$f" 2>/dev/null || true
              fi
            fi
          done
          git add docs/dashboard-data.json docs/charts-manifest.json docs/trades-manifest.json docs/rankings-manifest.json docs/llm-iterations-manifest.json docs/review.html automation/reports/llm_iteration/ || true
          git commit -m "auto(dashboard): daily web data update $(date -u +%Y-%m-%dT%H:%M)" --allow-empty || true
          # Rebase before pushing: the dashboard data is published straight
          # to the public site, so a push rejected as non-fast-forward means
          # the site keeps serving yesterday's data.
          git fetch origin main && git pull --rebase origin main || true
          git push origin main || true

      - name: "Send final completion TG"
        if: always()
        working-directory: automation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > /tmp/tg_done.py <<'EOF'
          import os, requests
          from datetime import datetime
          from zoneinfo import ZoneInfo
          hkt = datetime.now(ZoneInfo("Asia/Hong_Kong")).strftime("%Y-%m-%d %H:%M HKT")
          ny = datetime.now(ZoneInfo("America/New_York")).strftime("%Y-%m-%d %H:%M EDT")
          msg = (
              "✅ <b>Daily Auto-Pipeline Complete</b>\n\n"
              "🌐 Web: https://yip-lgtm.github.io/YW-concept-ki7409/\n"
              f"⏰ HKT: {hkt}\n⏰ NY: {ny}\n\n"
              "📊 Rank + LLM iter + web + backup + push — all done.\n"
              "No manual needed."
          )
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          r = requests.post(
              url,
              json={"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": msg, "parse_mode": "HTML"},
              timeout=10,
          )
          print("TG:", r.json().get("ok"))
          EOF
          # strip leading indent from heredoc body
          sed -i 's/^          //' /tmp/tg_done.py
          .venv/bin/python /tmp/tg_done.py

      - name: Commit ranking + iteration
        if: always()
        run: |
          git config --global user.name "Mavis bot"
          git config --global user.email "mavis@MiniMax"
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/yip-lgtm/YW-concept-ki7409.git"
          git add automation/reports/strategy_ranking/ || true
          git commit -m "auto(ranking): daily strategy PnL ranking + LLM iteration $(date -u +%Y-%m-%dT%H:%M)" --allow-empty || true
          # Rebase onto the remote tip before pushing. Other workflows commit
          # to main every few minutes, so a push from a stale base is
          # rejected as non-fast-forward — and the rejected push took the
          # freshly generated ranking files down with it. `|| true` on the
          # push used to hide this: the step went green and the ranking
          # file for the day silently never reached main.
          git fetch origin main && git pull --rebase origin main || true
          git push origin main || true

      - name: "Daily auto-push (catch-all: settlement + config + missing reports)"
        if: always()
        working-directory: automation
        env:
          GITHUB_PAT: ${{ secrets.APEX_PAT }}
        run: |
          # Do NOT append `|| true` here. The auto-push is the last thing
          # that persists the settlement's level state, and swallowing its
          # exit code meant a rejected push looked like a green run.
          set -o pipefail
          .venv/bin/python scripts/daily_auto_push.py 2>&1 | tee /tmp/auto_push_log.txt
          echo "auto-push-step:exit=$?" >> /tmp/auto_push_log.txt
