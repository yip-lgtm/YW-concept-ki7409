name: LLM Iteration Scientist — Per-Agent Self-Optimization

# Daily at 00:00 HKT (cron 0 16 * * 1-5)
# Self-optimize 10 strategy agents using LLM analysis
# Auto-applies high-confidence (>= 60%) parameter changes

on:
  schedule:
    - cron: '0 16 * * 1-5'  # 00:00 HKT weekdays
  workflow_dispatch: {}

permissions:
  contents: write

# 2026-11-03: serialise every workflow that pushes to `main`.
#
# 13 workflows push to `main` and they used to do it concurrently, so two
# of them could reach `git push` at the same moment. The loser got a
# non-fast-forward rejection, which most workflows swallow with
# `|| echo "push failed"` — so the commit was silently lost. Measured
# example: tech-analyst generated 36 charts at 18:05 CST, committed
# 29d16cd, and that commit never reached origin/main while six other
# workflows pushed in the same two-minute window.
#
# A shared group makes GitHub queue the runs instead. `cancel-in-progress:
# false` because a cancelled run loses all its work.
concurrency:
  group: push-main
  cancel-in-progress: false
jobs:
  llm-iteration-scientist:
    name: 🧬 LLM Iteration Scientist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip', cache-dependency-path: automation/requirements.txt}
      - run: python -m venv .venv && .venv/bin/pip install -q -r automation/requirements.txt
      - name: Run LLM Iteration Scientist
        run: .venv/bin/python automation/scripts/llm_iteration_scientist.py
      - name: Commit iteration report
        run: |
          git config user.name "llm-iteration-scientist"
          git config user.email "iter-sci@MiniMax"
          git add automation/reports/strategy_ranking/iterations/ || true
          git add automation/src/ || true
          git commit -m "auto(llm-iter-sci): per-agent iteration $(date -u +%Y-%m-%dT%H:%M:%SZ)" --allow-empty || true
          git stash --include-untracked 2>&1 || echo "no stash needed"
          git pull --rebase origin main 2>&1 || echo "rebase failed"
          git stash pop 2>&1 || echo "no stash to pop"
          git add automation/reports/strategy_ranking/iterations/ || true
          git add automation/src/ || true
          git commit --amend --no-edit 2>&1 || echo "amend failed (no changes)"
          git push origin main 2>&1 || echo "push failed"
