name: 'OCS BTC 5m Auto-Signal'

# Runs OCS-Style AI Trader on BTC-USD 5m every 5 min, 24/7.
# On actionable signal (vote >= 4 + conf >= 0.55):
#   - Sends TG alert
#   - Auto-publishes to AI-Trader
#   - Saves signal log

on:
  schedule:
    # Every 5 min, 24/7 — only triggers on new 5m bar (00:05, 00:10, ...)
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ocs-scan:
    name: OCS BTC 5m scan
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      AI_TRADER_TOKEN: ${{ secrets.AI_TRADER_TOKEN }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.APEX_PAT }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install deps
        working-directory: automation
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Run OCS scan
        id: scan
        working-directory: automation
        env:
          YF_CACHE: /tmp/yf_cache
        run: |
          .venv/bin/python src/ocs_btc_5m.py 2>&1 | tee /tmp/ocs_log.txt
          cat /tmp/ocs_btc/latest.json
          echo
          # Run the act script (TG alert + AI-Trader publish + log)
          .venv/bin/python scripts/ocs_act.py
      - name: Run position tracker
        id: tracker
        working-directory: automation
        env:
          YF_CACHE: /tmp/yf_cache
        run: |
          # Walk forward open positions, check SL/TP hits, log P&L
          .venv/bin/python scripts/ocs_position_tracker.py 2>&1 | tee /tmp/tracker_log.txt
      - name: Generate daily report
        id: daily
        working-directory: automation
        if: always()
        run: |
          # Daily P&L report (chart + markdown)
          .venv/bin/python scripts/ocs_daily_report.py 2>&1 || true
      - name: Commit signal log
        if: always()
        run: |
          git config --global user.name "Mavis bot"
          git config --global user.email "mavis@MiniMax"
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/yip-lgtm/YW-concept-ki7409.git"
          git add automation/reports/ocs_btc_5m/ || true
          git commit -m "auto(ocs-btc): signal log $(date -u +%Y-%m-%dT%H:%M)" --allow-empty || true
          git push origin main || true
