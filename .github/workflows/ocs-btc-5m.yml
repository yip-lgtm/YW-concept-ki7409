name: 'OCS BTC 5m Auto-Signal'

# Runs OCS-Style AI Trader on BTC-USD 5m every 5 min, 24/7.
# On actionable signal (vote >= 4 + conf >= 0.55):
#   - Sends TG alert
#   - Auto-publishes to AI-Trader
#   - Saves signal log

on:
  schedule:
    # Every 5 min, 24/7 — only triggers on new 5m bar (00:05, 00:10, ...)
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ocs-scan:
    name: OCS BTC 5m scan
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      AI_TRADER_TOKEN: ${{ secrets.AI_TRADER_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.APEX_PAT }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install deps
        working-directory: automation
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Run OCS scan
        id: scan
        working-directory: automation
        env:
          YF_CACHE: /tmp/yf_cache
        run: |
          .venv/bin/python src/ocs_btc_5m.py 2>&1 | tee /tmp/ocs_log.txt
          # Print the latest signal
          cat /tmp/ocs_btc/latest.json
          echo
          # Read signal + act
          .venv/bin/python << 'PYEOF'
          import os, json, requests
          from pathlib import Path

          sig_path = Path("/tmp/ocs_btc/latest.json")
          if not sig_path.exists():
              print("❌ No signal file")
              exit(0)
          data = json.loads(sig_path.read_text())
          signal = data.get("signal")
          vote = data.get("vote", 0)
          conf = data.get("conf", 0)
          direction = data.get("direction")
          last_close = data.get("last_close", 0)
          atr = data.get("atr", 0)

          print(f"Vote: {vote}, Conf: {conf:.2f}, Signal: {signal}")

          # Only act on actionable signals
          if signal not in ("buy", "sell"):
              print(f"⚠️  No actionable signal (vote={vote}, need ±{4})")
              exit(0)

          # Compute SL/TP
          sl_dist = atr * 1.6
          t1 = sl_dist * 1.0
          t2 = sl_dist * 1.618
          t3 = sl_dist * 2.618
          t4 = sl_dist * 3.618
          t5 = sl_dist * 5.0

          if signal == "buy":
              sl = last_close - sl_dist
              t1_p, t2_p, t3_p, t4_p, t5_p = last_close + t1, last_close + t2, last_close + t3, last_close + t4, last_close + t5
          else:
              sl = last_close + sl_dist
              t1_p, t2_p, t3_p, t4_p, t5_p = last_close - t1, last_close - t2, last_close - t3, last_close - t4, last_close - t5

          # 1. Send TG alert
          emoji = "🟢" if signal == "buy" else "🔴"
          arrow = "LONG" if signal == "buy" else "SHORT"
          tg_msg = f"""{emoji} **OCS BTC 5m Signal — {arrow}**

**Ticker**: BTC-USD @ ${last_close:,.2f}
**Signal**: {signal.upper()} (vote {vote:+d}/±7, conf {conf:.2f})
**Direction**: {direction}

**Risk Plan** (1.6× ATR stop, R-multiple targets):
• **Stop**: ${sl:,.2f} (${sl_dist:,.2f} away)
• **T1** (1R): ${t1_p:,.2f}
• **T2** (1.618R): ${t2_p:,.2f}
• **T3** (2.618R): ${t3_p:,.2f}
• **T4** (3.618R): ${t4_p:,.2f}
• **T5** (5.0R): ${t5_p:,.2f}

⚠️ Treat T1 as first scale-out, stop is catastrophic invalidation (not tight scalp).
"""
          r = requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              json={"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": tg_msg,
                    "parse_mode": "Markdown", "disable_web_page_preview": True},
              timeout=15,
          )
          print(f"TG: HTTP {r.status_code}")

          # 2. Publish to AI-Trader
          payload = {
              "market": "crypto",
              "title": f"BTC-USD OCS {signal.upper()} (vote {vote:+d}, conf {conf:.2f})"[:100],
              "content": tg_msg[:1500],
              "symbols": "BTC-USD",
              "tags": ",".join(["ocs-ai", "btc", "5m", signal]),
          }
          r2 = requests.post(
              "https://ai4trade.ai/api/signals/strategy",
              headers={"Authorization": f"Bearer {os.environ['AI_TRADER_TOKEN']}",
                       "Content-Type": "application/json"},
              json=payload,
              timeout=15,
          )
          r2.raise_for_status()
          result = r2.json()
          print(f"AI-Trader: signal_id={result.get('signal_id')} +{result.get('points_earned')} points")

          # 3. Save log
          log_dir = Path("automation/reports/ocs_btc_5m")
          log_dir.mkdir(parents=True, exist_ok=True)
          from datetime import datetime, timezone, timedelta
          HKT = timezone(timedelta(hours=8))
          now = datetime.now(HKT).strftime("%Y%m%d_%H%M%S")
          log_file = log_dir / f"signals.jsonl"
          with log_file.open("a") as f:
              f.write(json.dumps({
                  "ts": now,
                  "signal": signal,
                  "direction": direction,
                  "vote": vote,
                  "conf": conf,
                  "last_close": last_close,
                  "atr": atr,
                  "sl": sl,
                  "t1": t1_p,
                  "t2": t2_p,
                  "t3": t3_p,
                  "t4": t4_p,
                  "t5": t5_p,
                  "signal_id": result.get("signal_id"),
              }, default=str) + "\n")
          print(f"Log: {log_file}")
          PYEOF

      - name: Commit signal log
        if: always()
        run: |
          git config --global user.name "Mavis bot"
          git config --global user.email "mavis@MiniMax"
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/yip-lgtm/YW-concept-ki7409.git"
          git add automation/reports/ocs_btc_5m/ || true
          git commit -m "auto(ocs-btc): signal log $(date -u +%Y-%m-%dT%H:%M)" --allow-empty || true
          git push origin main || true
