name: Fetch futures history (Yahoo)

# The Polygon deep history covers crypto only — every CME future returns
# zero results on that plan, which is why the TTrades family and
# Argon-Gold could not be backtested on the instruments they actually
# trade. Yahoo serves the futures: 730 days of hourly and 60 days of
# fifteen-minute and five-minute bars.
#
# CI has network access to Yahoo, so the fetch runs here. The output
# lands in the same layout as the Polygon files, so every tool that
# reads the deep history reads this too.
#
# MGC=F is the gold contract the book actually trades: it is in the
# live ticker list, it is where most of the TTrades activity is, and
# it is the contract the Argon SOP's stop arithmetic was written for.

on:
  schedule:
    - cron: '37 4 * * 0'   # weekly, Sunday 04:37 UTC
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Yahoo symbol to fetch, comma separated'
        required: false
        default: 'MGC=F'
      intervals:
        description: 'intervals to fetch'
        required: false
        default: '60m 15m 5m'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.APEX_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        working-directory: automation
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: Fetch
        run: |
          cd automation
          .venv/bin/python scripts/fetch_yahoo_history.py \
            --ticker "${{ github.event.inputs.ticker || 'MGC=F' }}" \
            --intervals ${{ github.event.inputs.intervals || '60m 15m 5m' }}
      - name: Commit
        run: |
          git config --global user.name "Mavis bot"
          git config --global user.email "mavis@MiniMax"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/yip-lgtm/YW-concept-ki7409.git"
          git add automation/data/deep_history/ || true
          if git diff --cached --quiet; then
            echo "No new history"
            exit 0
          fi
          git commit -m "auto(data): futures history (Yahoo) $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push origin main
