name: System Engineer — Auto-Fix Supervisor Issues

# Runs hourly to:
# 1. Read latest supervisor report
# 2. Diagnose BUG with LLM (MiniMax-M3)
# 3. Detect lazy agents (0 signals/24h)
# 4. Auto-apply fixes for known patterns
# 5. Send TG report

on:
  schedule:
    # System Engineer runs every 30 min to detect lazy + bugs
    - cron: '0 * * * *'  # Every hour on the hour (was */30, quota reduction 2026-09-16)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

# 2026-11-03: serialise every workflow that pushes to `main`.
#
# 13 workflows push to `main` and they used to do it concurrently, so two
# of them could reach `git push` at the same moment. The loser got a
# non-fast-forward rejection, which most workflows swallow with
# `|| echo "push failed"` — so the commit was silently lost. Measured
# example: tech-analyst generated 36 charts at 18:05 CST, committed
# 29d16cd, and that commit never reached origin/main while six other
# workflows pushed in the same two-minute window.
#
# A shared group makes GitHub queue the runs instead. `cancel-in-progress:
# false` because a cancelled run loses all its work.
concurrency:
  group: push-main
  cancel-in-progress: false
jobs:
  sys-engineer:
    name: 🛠️ System Engineer
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip', cache-dependency-path: automation/requirements.txt}
      - run: python -m venv .venv && .venv/bin/pip install -q -r automation/requirements.txt
      - name: Run system engineer
        run: .venv/bin/python automation/scripts/sys_engineer.py
      - name: Commit sys-eng report
        run: |
          git config user.name "sys-engineer" && \
          git config user.email "sys-eng@MiniMax" && \
          git add automation/reports/sys_engineer/ || true
          git commit -m "auto(sys-eng): report $(date -u +%Y-%m-%dT%H:%M:%SZ)" --allow-empty || true
          git stash --include-untracked 2>&1 || echo "no stash needed"
          git pull --rebase origin main 2>&1 || echo "rebase failed"
          git stash pop 2>&1 || echo "no stash to pop"
          git add automation/reports/sys_engineer/ || true
          git commit --amend --no-edit 2>&1 || echo "amend failed (no changes)"
          git push origin main 2>&1 || echo "push failed"
