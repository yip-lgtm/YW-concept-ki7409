name: 'YW Concept — Publish Top Signal to AI-Trader'

# After YW daily reminder runs (21:00 HKT), publish the top actionable
# candidate to ai4trade.ai as a strategy signal.
# Connects apex-bootcamp YW strategy → AI-Trader marketplace.
# Earns reputation points; followers can copy the trade.

on:
  schedule:
    # 13:30 UTC = 21:30 HKT = 30 min after YW daily reminder
    - cron: '5 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# 2026-11-03: serialise every workflow that pushes to `main`.
#
# 13 workflows push to `main` and they used to do it concurrently, so two
# of them could reach `git push` at the same moment. The loser got a
# non-fast-forward rejection, which most workflows swallow with
# `|| echo "push failed"` — so the commit was silently lost. Measured
# example: tech-analyst generated 36 charts at 18:05 CST, committed
# 29d16cd, and that commit never reached origin/main while six other
# workflows pushed in the same two-minute window.
#
# A shared group makes GitHub queue the runs instead. `cancel-in-progress:
# false` because a cancelled run loses all its work.
concurrency:
  group: push-main
  cancel-in-progress: false
jobs:
  publish-signal:
    name: Publish top YW signal to AI-Trader
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install --quiet requests

      - name: Publish top signal
        working-directory: automation
        env:
          AI_TRADER_TOKEN: ${{ secrets.AI_TRADER_TOKEN }}
        run: |
          # Save token to a file (publish_signal.py expects CREDENTIALS.json)
          mkdir -p /tmp/aitrader
          cat > /tmp/aitrader/CREDENTIALS.json << EOF
          {
            "agent_id": 23452,
            "name": "Mavis-Apex-YW-Bot",
            "token": "${AI_TRADER_TOKEN}",
            "base_url": "https://ai4trade.ai/api"
          }
          EOF
          AI_TRADER_CRED=/tmp/aitrader/CREDENTIALS.json \
            python3 scripts/publish_signal.py --yw-repo .

      - name: Commit publish log
        run: |
          git config --global user.name "Mavis bot"
          git config --global user.email "mavis@MiniMax"
          git add automation/reports/daily/ || true
          git commit -m "auto(yw): published signal $(date -u +%Y-%m-%d)" --allow-empty || true
          # Rebase before pushing: other workflows commit to main every few
          # minutes, so a push from a stale base is rejected as
          # non-fast-forward and the published signal is silently lost.
          git fetch origin main && git pull --rebase origin main || true
          git push origin main || true
