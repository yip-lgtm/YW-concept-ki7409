name: '9 Strategy Live Scan — 24/7 Detector Sweep'

# Runs ALL 9 strategy detectors every 5 min, 24/7.
# 9 detectors × 4 tickers = 36 parallel detector runs per scan.
# LLM only invoked on detector signal → ~10-30 calls/day (low cost).
#
# This is the production loop for the 9 strategy sub-agents:
#  - Detector: 288 scans/day, no LLM
#  - LLM: only on signal, A/B grade → fire TG + AI-Trader
#
# Schedule offsets 1 min after OCS scan (which runs */5).

on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-scan:
    name: 9 Strategy live scan (288/day)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      AI_TRADER_TOKEN: ${{ secrets.AI_TRADER_TOKEN }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.APEX_PAT }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install deps
        working-directory: automation
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r automation/requirements.txt

      - name: Run 9-strategy live scan
        id: scan
        working-directory: automation
        env:
          YF_CACHE: /tmp/yf_cache
        run: |
          .venv/bin/python scripts/live_scan.py 2>&1 | tee /tmp/live_scan_log.txt
      - name: Run live-scan position tracker
        id: tracker
        working-directory: automation
        env:
          YF_CACHE: /tmp/yf_cache
        run: |
          # Walk forward open positions, check SL/TP hits, log P&L
          .venv/bin/python scripts/live_scan_tracker.py 2>&1 | tee /tmp/live_tracker_log.txt || true
      - name: Commit heartbeat + signals
        if: always()
        run: |
          git config --global user.name "Mavis bot"
          git config --global user.email "mavis@MiniMax"
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/yip-lgtm/YW-concept-ki7409.git"
          git pull --rebase --autostash origin main 2>&1 || echo "pull failed, continuing"
          git add automation/reports/live_scan/ || true
          git commit -m "auto(live-scan): 9 strategies $(date -u +%Y-%m-%dT%H:%M) signals=$(jq -r .n_signals automation/reports/live_scan/heartbeat.json 2>/dev/null || echo 0)" --allow-empty || true
          git push --force-with-lease origin main || echo "push failed"
