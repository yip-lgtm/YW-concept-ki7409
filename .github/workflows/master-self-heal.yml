name: Master Self-Heal — 24/7 Pipeline Doctor

# Self-healing master workflow:
# - Checks 5 critical workflows (live-scan, ocs-btc, supervisor, sys-engineer, dashboard)
# - Re-triggers any stalled (last success > 25 min)
# - Runs at 12 offsets per hour to avoid GHA queue congestion
# - Self-monitors: TG alert if THIS workflow missed 3+ runs

on:
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Health check + re-trigger stalled workflows
        run: |
          THRESHOLD_MIN=25
          NOW=$(date -u +%s)
          STALLED_LIST=""
          
          for WF in "live-scan.yml" "ocs-btc-5m.yml" "supervisor-monitor.yml" "sys-engineer.yml" "update-dashboard-data.yml"; do
            LAST_SUCCESS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/actions/workflows/$WF/runs?status=completed&conclusion=success&per_page=1" \
              | python3 -c "import sys, json; d=json.load(sys.stdin); r=d.get('workflow_runs', [{}])[0]; print(r.get('created_at', '1970-01-01T00:00:00Z'))" 2>/dev/null || echo "1970-01-01T00:00:00Z")
            
            LAST_TS=$(date -u -d "$LAST_SUCCESS" +%s 2>/dev/null || echo 0)
            DIFF=$(( (NOW - LAST_TS) / 60 ))
            
            echo "[$WF] last success: $LAST_SUCCESS (${DIFF}m ago)"
            
            if [ $DIFF -gt $THRESHOLD_MIN ]; then
              echo "  Stalled (${DIFF}m > ${THRESHOLD_MIN}m) - re-triggering"
              curl -s -X POST -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/actions/workflows/$WF/dispatches" \
                -d '{"ref": "main"}' -H "Content-Type: application/json" > /dev/null
              echo "  Triggered $WF"
              STALLED_LIST="$STALLED_LIST $WF"
            else
              echo "  Healthy"
            fi
          done
          
          if [ -n "$STALLED_LIST" ]; then
            MSG="🔧 Pipeline Self-Heal @ $(date -u '+%H:%M UTC')\nStalled:$STALLED_LIST\nAction: Auto re-triggered"
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT}&text=${MSG}" > /dev/null 2>&1
          fi
