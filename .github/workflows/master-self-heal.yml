name: Master Self-Heal — 24/7 Pipeline Doctor

# Self-healing master workflow:
# - Checks 5 critical workflows (live-scan, ocs-btc, supervisor, sys-engineer, dashboard)
# - Re-triggers any stalled (last success > 25 min)
# - Runs at 12 offsets per hour to avoid GHA queue congestion
# - Self-monitors: TG alert if THIS workflow missed 3+ runs
# - Combined supervisor + watchdog + sys-engineer health check
# 
# Cron spread: 0,3,7,12,17,23,28,33,37,42,47,53 (avoids :15/:30/:45 congestion)

on:
  schedule:
    - cron: '0,3,7,12,17,23,28,33,37,42,47,53 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Health check + re-trigger stalled workflows
        run: |
          THRESHOLD_MIN=25
          NOW=$(date -u +%s)
          STALLED=()
          TRIGGERED=()
          HEALTHY=()
          
          # 5 critical 24/7 workflows
          for WF in "live-scan.yml" "ocs-btc-5m.yml" "supervisor-monitor.yml" "sys-engineer.yml" "update-dashboard-data.yml"; do
            LAST_SUCCESS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/actions/workflows/$WF/runs?status=completed&conclusion=success&per_page=1" \
              | python3 -c "import sys, json; d=json.load(sys.stdin); r=d.get('workflow_runs', [{}])[0]; print(r.get('created_at', '1970-01-01T00:00:00Z'))" 2>/dev/null || echo "1970-01-01T00:00:00Z")
            
            LAST_TS=$(date -u -d "$LAST_SUCCESS" +%s 2>/dev/null || echo 0)
            DIFF=$(( (NOW - LAST_TS) / 60 ))
            
            echo "[$WF] last success: $LAST_SUCCESS (${DIFF}m ago)"
            
            if [ $DIFF -gt $THRESHOLD_MIN ]; then
              echo "  ⚠️  Stalled (${DIFF}m > ${THRESHOLD_MIN}m) — re-triggering"
              STALLED+=("$WF")
              curl -s -X POST -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/actions/workflows/$WF/dispatches" \
                -d '{"ref": "main"}' -H "Content-Type: application/json" > /dev/null
              TRIGGERED+=("$WF")
              echo "  ✓ Triggered $WF"
            else
              echo "  ✓ Healthy"
              HEALTHY+=("$WF")
            fi
          done
          
          # Summary
          echo ""
          echo "=== Summary ==="
          echo "Healthy: ${#HEALTHY[@]}"
          echo "Stalled + Re-triggered: ${#TRIGGERED[@]}"
          
          # TG alert if any stalled
          if [ ${#TRIGGERED[@]} -gt 0 ]; then
            MSG="🔧 Pipeline Self-Heal @ $(date -u '+%H:%M UTC')\n\n"
            MSG+="Stalled: ${TRIGGERED[@]}\n"
            MSG+="Action: Auto re-triggered"
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT}&text=${MSG}" > /dev/null 2>&1
          fi

      - name: Self-monitor: alert if this workflow missing
        run: |
          # Get this workflow's last 5 runs
          RECENT=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/actions/workflows/master-self-heal.yml/runs?per_page=5" \
            | python3 -c "
import sys, json
from datetime import datetime, timezone, timedelta
runs = json.load(sys.stdin).get('workflow_runs', [])
now = datetime.now(timezone.utc)
missed = 0
for r in runs:
    if r.get('conclusion') == 'success':
        continue
    age = (now - datetime.fromisoformat(r['created_at'].replace('Z', '+00:00'))).total_seconds() / 60
    if age < 60:
        missed += 1
print(missed)
")
          
          if [ "$RECENT" -ge 3 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT}&text=🚨 Master Self-Heal: $RECENT failures in last 5 runs. Manual check needed." > /dev/null 2>&1
          fi
