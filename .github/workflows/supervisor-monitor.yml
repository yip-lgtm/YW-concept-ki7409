name: 'Strategy Supervisor — 24/7 Health Monitor'

# 9 strategy sub-agents + OCS BTC 5m + 5 GHA workflows health check.
# Runs every 5 min, 24/7. Alerts TG on anomaly.
# Supervisor (👑 strategy-supervisor) is the registered Mavis agent that owns this.

on:
  schedule:
    # 12 offsets per hour — between live-scan (1,6,11...) and OCS
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  supervisor-monitor:
    name: Strategy supervisor health check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.APEX_PAT }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install deps
        working-directory: automation
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Run supervisor monitor
        id: monitor
        working-directory: automation
        run: |
          .venv/bin/python scripts/supervisor_monitor.py 2>&1 | tee /tmp/supervisor_log.txt
      - name: Strategy sub-agent health check (9 agents)
        working-directory: automation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          .venv/bin/python scripts/strategy_supervisor.py --tg --bugs-only 2>&1 | tee /tmp/strategy_supervisor.log

      - name: Commit supervisor state
        if: always()
        run: |
          git config --global user.name "Mavis bot"
          git config --global user.email "mavis@MiniMax"
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/yip-lgtm/YW-concept-ki7409.git"
          git pull --rebase --autostash origin main 2>&1 || echo "pull failed, continuing"
          git add automation/reports/supervisor/ || true
          git commit -m "auto(supervisor): health check $(date -u +%Y-%m-%dT%H:%M)" --allow-empty || true
          git push --force-with-lease origin main || echo "push failed"
