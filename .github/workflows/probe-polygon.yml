name: Probe Polygon data depth (diagnostic)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe specific windows
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error, datetime
          key = os.environ.get("POLYGON_API_KEY", "")
          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read().decode())
                  except Exception: return e.code, {}
              except Exception as e:
                  return 0, {"message": f"{type(e).__name__}: {e}"}
          def probe(frm, to, mult=5, span="minute"):
              url = (f"https://api.polygon.io/v2/aggs/ticker/X:BTCUSD/range/{mult}/{span}/{frm}/{to}"
                     f"?apiKey={key}&limit=50000&sort=asc")
              code, j = get(url)
              res = (j.get("results") or []) if isinstance(j, dict) else []
              if res:
                  d0 = datetime.datetime.utcfromtimestamp(res[0]["t"]/1000).date()
                  d1 = datetime.datetime.utcfromtimestamp(res[-1]["t"]/1000).date()
                  return f"HTTP {code} {len(res):>6} bars  {d0} -> {d1}"
              return f"HTTP {code} EMPTY body={json.dumps(j)[:220]}"
          for frm, to in [("2026-01-01","2026-02-01"), ("2026-02-01","2026-03-01"),
                          ("2026-05-01","2026-06-01"), ("2026-08-01","2026-09-01"),
                          ("2026-09-01","2026-10-01"), ("2026-10-01","2026-10-20"),
                          ("2025-12-01","2026-01-01")]:
              print(f"  {frm} -> {to}  {probe(frm,to)}", flush=True)
          # Also: a single long range, to see where it truncates.
          print("  long range 2024-01-01 -> 2026-10-20:", flush=True)
          print("   ", probe("2024-01-01","2026-10-20"), flush=True)
          PY
