name: Probe Polygon data depth (diagnostic)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe pagination depth
        run: |
          python - <<'PY'
          import os, json, time, urllib.request, urllib.error, datetime

          key = os.environ.get("POLYGON_API_KEY", "")
          print(f"key present: {bool(key)}", flush=True)

          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=45) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read().decode())
                  except Exception:
                      return e.code, {}
              except Exception as e:
                  return 0, {"message": f"{type(e).__name__}: {e}"}

          # Walk the pagination chain backwards and see how deep the 5-minute
          # history actually goes for crypto.
          for ticker in ["X:BTCUSD"]:
              to = datetime.date.today()
              frm = to - datetime.timedelta(days=800)
              url = (f"https://api.polygon.io/v2/aggs/ticker/{ticker}/range/5/minute/"
                     f"{frm}/{to}?apiKey={key}&limit=50000&sort=asc")
              pages = 0
              total = 0
              oldest = None
              newest = None
              while url and pages < 40:
                  code, j = get(url)
                  if not isinstance(j, dict):
                      print(f"  {ticker}: non-json at page {pages}", flush=True)
                      break
                  res = j.get("results") or []
                  if res:
                      if oldest is None:
                          oldest = res[0]["t"]
                      newest = res[-1]["t"]
                      total += len(res)
                  pages += 1
                  url = j.get("next_url")
                  if url:
                      if "apiKey" not in url:
                          url += f"&apiKey={key}"
                      time.sleep(1.2)   # stay under the per-minute cap
              if oldest:
                  d0 = datetime.datetime.utcfromtimestamp(oldest/1000).date()
                  d1 = datetime.datetime.utcfromtimestamp(newest/1000).date()
                  print(f"  {ticker}: {pages} pages, {total} bars, {d0} -> {d1}", flush=True)
              else:
                  print(f"  {ticker}: no results over 800 days", flush=True)
          PY
