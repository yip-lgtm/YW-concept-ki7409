name: Always-On Trigger 3 — Stall Detector (3rd Backup)

# 3rd backup with even more offset crons
# Combined with trigger-1 (3,8,13,18,23,...) and trigger-2 (4,9,14,19,24,...),
# at least 1 will fire every minute.

on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      GH_TOKEN: ${{ secrets.APEX_PAT }}
    steps:
      - name: Check + re-trigger
        run: |
          THRESHOLD_MIN=8
          NOW=$(date -u +%s)
          
          # Check any status (not just success) to avoid 1970 fallback bug
          LAST_RUN=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/actions/workflows/unified-pipeline.yml/runs?per_page=1" \
            | python3 -c "import sys, json; d=json.load(sys.stdin); r=d.get('workflow_runs', []); print(r[0].get('created_at', '') if r else '')" 2>/dev/null || echo "")
          
          if [ -z "$LAST_RUN" ]; then
            echo "No runs found - skipping (API may be down)"
            exit 0
          fi
          
          LAST_TS=$(date -u -d "$LAST_RUN" +%s 2>/dev/null || echo 0)
          if [ "$LAST_TS" = "0" ]; then
            echo "Invalid date - skipping"
            exit 0
          fi
          DIFF=$(( (NOW - LAST_TS) / 60 ))
          
          echo "[always-on-3] last: ${DIFF}m ago"
          
          if [ $DIFF -gt $THRESHOLD_MIN ]; then
            curl -s -X POST -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/actions/workflows/unified-pipeline.yml/dispatches" \
              -d '{"ref": "main"}' -H "Content-Type: application/json" > /dev/null
            echo "  Triggered"
          fi
