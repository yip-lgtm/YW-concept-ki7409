name: Always-On Trigger 3 — Stall Detector (3rd Backup)

# 3rd backup with even more offset crons
# Combined with trigger-1 (3,8,13,18,23,...) and trigger-2 (4,9,14,19,24,...),
# at least 1 will fire every minute.

on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check + re-trigger
        run: |
          THRESHOLD_MIN=8
          NOW=$(date -u +%s)
          
          LAST_SUCCESS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/actions/workflows/unified-pipeline.yml/runs?status=completed&conclusion=success&per_page=1" \
            | python3 -c "import sys, json; d=json.load(sys.stdin); r=d.get('workflow_runs', [{}])[0]; print(r.get('created_at', '1970-01-01T00:00:00Z'))" 2>/dev/null || echo "1970-01-01T00:00:00Z")
          
          LAST_TS=$(date -u -d "$LAST_SUCCESS" +%s 2>/dev/null || echo 0)
          DIFF=$(( (NOW - LAST_TS) / 60 ))
          
          echo "[always-on-3] last: ${DIFF}m ago"
          
          if [ $DIFF -gt $THRESHOLD_MIN ]; then
            curl -s -X POST -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/actions/workflows/unified-pipeline.yml/dispatches" \
              -d '{"ref": "main"}' -H "Content-Type: application/json" > /dev/null
            echo "  Triggered"
          fi
