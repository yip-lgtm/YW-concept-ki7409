name: Pipeline Scheduler — 5min Git-based Watchdog

# Replaces sandbox heartbeat_cron.py
# Uses git commit timestamp as health check (sandbox-independent)
# Triggers unified-pipeline if no signal/auto commit in 30+ min
# No sandbox process required

on:
  schedule:
    # Every 5 min, 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.APEX_PAT }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Git-based pipeline watchdog
        run: |
          set -e
          
          echo "=== Pipeline Scheduler @ $(date -u) ==="
          
          # Check last git commit time (sandbox-independent)
          LAST_COMMIT=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/commits?per_page=1" \
            | python3 -c "import sys, json; d=json.load(sys.stdin); c=d[0]['commit']['author']['date']; print(c)" 2>/dev/null)
          
          if [ -z "$LAST_COMMIT" ]; then
            echo "❌ Cannot fetch commits - API may be down"
            exit 0
          fi
          
          NOW=$(date -u +%s)
          LAST_TS=$(date -u -d "$LAST_COMMIT" +%s)
          DIFF_MIN=$(( (NOW - LAST_TS) / 60 ))
          echo "Last commit: $LAST_COMMIT (${DIFF_MIN}m ago)"
          
          # Check signal commit (live-scan auto commits)
          LAST_SIGNAL=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/commits?path=automation/reports/live_scan/signals.jsonl&per_page=1" \
            | python3 -c "import sys, json; d=json.load(sys.stdin); print(d[0]['commit']['author']['date'] if d else 'never')" 2>/dev/null)
          if [ "$LAST_SIGNAL" != "never" ]; then
            SIG_TS=$(date -u -d "$LAST_SIGNAL" +%s)
            SIG_AGE=$(( (NOW - SIG_TS) / 60 ))
            echo "Last signal commit: $LAST_SIGNAL (${SIG_AGE}m ago)"
          else
            SIG_AGE=999
          fi
          
          # If no signal/auto commit in 30+ min, trigger unified-pipeline
          # (signal commit indicates live_scan ran)
          STALLED=false
          if [ $DIFF_MIN -gt 30 ]; then
            echo "⚠️ No commits in ${DIFF_MIN}m (> 30m threshold)"
            STALLED=true
          fi
          if [ $SIG_AGE -gt 30 ]; then
            echo "⚠️ No signal commit in ${SIG_AGE}m (> 30m threshold)"
            STALLED=true
          fi
          
          # Check ranking freshness — auto-trigger strategy-ranking if stale > 30h
          LATEST_RANK=$(curl -s "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/contents/automation/reports/strategy_ranking" \
            -H "Authorization: token $GH_TOKEN" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    rank_files = [x for x in d if x['name'].startswith('ranking_') and x['name'].endswith('.json')]
    if not rank_files: print('none')
    else:
        latest = max(rank_files, key=lambda x: x['name'])
        print(latest['name'])
except: print('none')" 2>/dev/null)
          echo "  Latest ranking file: $LATEST_RANK"
          if [ "$LATEST_RANK" != "none" ] && [ "$LATEST_RANK" != "" ]; then
            RANK_DATE=$(echo $LATEST_RANK | sed 's/ranking_//;s/.json//')
            RANK_TS=$(date -u -d "$RANK_DATE" +%s 2>/dev/null || echo 0)
            if [ $RANK_TS -gt 0 ]; then
              RANK_AGE_HOURS=$(( (NOW - RANK_TS) / 3600 ))
              echo "  Ranking age: ${RANK_AGE_HOURS}h"
              if [ $RANK_AGE_HOURS -gt 30 ]; then
                echo "⚠️ Ranking stale ${RANK_AGE_HOURS}h (> 30h threshold)"
                curl -s -X POST -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/actions/workflows/strategy-ranking.yml/dispatches" \
                  -H "Content-Type: application/json" \
                  -d "{\"ref\":\"main\"}" > /dev/null
                echo "🔄 strategy-ranking auto-triggered"
                curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
                  -d "chat_id=$TG_CHAT&text=⚠️ Ranking stale ${RANK_AGE_HOURS}h — auto-triggered strategy-ranking" > /dev/null
              fi
            fi
          fi
          
          if [ "$STALLED" = "true" ]; then
            echo "🚨 Pipeline appears stalled, re-triggering..."
            for WF in "unified-pipeline.yml" "ocs-btc-5m.yml" "tech-analyst.yml" "sys-engineer.yml"; do
              # Check if workflow exists
              EXISTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/actions/workflows/$WF" \
                | python3 -c "import sys, json; d=json.load(sys.stdin); print('ok' if d.get('id') else 'no')" 2>/dev/null || echo "no")
              if [ "$EXISTS" = "ok" ]; then
                curl -s -X POST -H "Authorization: token $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/yip-lgtm/YW-concept-ki7409/actions/workflows/$WF/dispatches" \
                  -d '{"ref": "main"}' > /dev/null
                echo "  ✓ Triggered $WF"
              fi
            done
            
            # Send TG alert (de-duped by alerts.jsonl)
            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              MSG="🚨 Pipeline stalled ${DIFF_MIN}m. Auto re-triggered (signals: ${SIG_AGE}m). Pipeline-Scheduler"
              curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d "chat_id=${TG_CHAT}&text=${MSG}" > /dev/null 2>&1
            fi
          else
            echo "✓ Pipeline healthy"
          fi
